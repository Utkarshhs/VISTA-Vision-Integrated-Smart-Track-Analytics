kind = "web"
previewPath = "/"
title = "RailTrack-AI"
version = "1.0.0"
id = "artifacts/railtrack"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25845

[services.development]
run = "pnpm --filter @workspace/railtrack run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/railtrack", "run", "build" ]
publicDir = "artifacts/railtrack/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25845"
BASE_PATH = "/"
